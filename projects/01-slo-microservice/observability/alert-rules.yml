groups:
  - name: sre-demo-service
    rules:
      - alert: High5xxErrorRatio
        expr: |
          sum(rate(http_requests_total{http_status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.05
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Sustained elevated 5xx ratio"
          description: "More than 5% of requests returned 5xx for at least 2 minutes."
      - alert: HighRequestLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency is above 500ms"
      - alert: TargetMissing
        expr: up{job="sre-demo-app"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Prometheus cannot scrape the application"
